<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTZ - Text to ZIP Generator</title>
    <!-- JSZip 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .desc {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-direction: column;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>📦 TTZ (Text to ZIP)</h1>
    <div class="desc">
        <strong>사용법:</strong><br>
        - <code>|</code> 기호는 폴더를 의미합니다.<br>
        - <code>\</code> 기호는 파일을 의미합니다.<br>
        - <code>-</code> 기호 뒤에 내용을 적으면 해당 파일 안에 내용이 들어갑니다.<br><br>
        <em>예시:</em><br>
        | my_project<br>
        &nbsp;&nbsp;\ index.html<br>
        &nbsp;&nbsp;&nbsp;&nbsp;- &lt;h1&gt;Hello World&lt;/h1&gt;<br>
        &nbsp;&nbsp;\ README.md<br>
        &nbsp;&nbsp;&nbsp;&nbsp;- 프로젝트 설명서입니다.
    </div>

    <div class="container">
        <div>
            <div class="section-title">구조 텍스트 입력</div>
            <textarea id="textInput" placeholder="| my_folder
  \ hello.txt
    - 여기에 적은 내용이 파일 안에 쏙 들어갑니다!"></textarea>
        </div>

        <div>
            <button id="generateBtn">ZIP 파일로 변환 및 다운로드</button>
        </div>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const textInput = document.getElementById('textInput');
            const generateBtn = document.getElementById('generateBtn');
            const text = textInput.value;

            if (!text.trim()) {
                alert('변환할 구조 텍스트를 입력해주세요!');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = '변환 중...';

            try {
                const normalizedText = text.replace(/\t/g, '    ');
                const lines = normalizedText.split('\n');
                const zip = new JSZip();
                
                let dirStack = [];
                let currentFile = null; // 현재 내용을 담을 대상 파일 경로
                let fileContents = {}; // 파일별 내용 저장 객체

                for (let line of lines) {
                    if (!line.trim()) continue;

                    const indent = line.search(/\S/);
                    const trimmed = line.trim();
                    const symbol = trimmed.charAt(0);
                    const contentName = trimmed.substring(1).trim();

                    if (symbol === '-') {
                        // 내용 행인 경우: 현재 지정된 파일이 있다면 내용 추가
                        if (currentFile) {
                            const lineContent = line.substring(indent).replace(/^-/, '').trim();
                            if (fileContents[currentFile] === undefined) {
                                fileContents[currentFile] = lineContent;
                            } else {
                                fileContents[currentFile] += '\n' + lineContent;
                            }
                        }
                        continue;
                    }

                    // 파일이나 폴더가 새로 시작되면 내용 수집 대상 초기화
                    currentFile = null;

                    if (symbol !== '|' && symbol !== '\\') {
                        continue; 
                    }

                    while (dirStack.length > 0 && dirStack[dirStack.length - 1].indent >= indent) {
                        dirStack.pop();
                    }

                    const currentPath = dirStack.map(d => d.name).join('/');
                    const fullPath = currentPath ? `${currentPath}/${contentName}` : contentName;

                    if (symbol === '|') {
                        dirStack.push({ name: contentName, indent: indent });
                        zip.folder(fullPath);
                    } else if (symbol === '\\') {
                        currentFile = fullPath; // 파일 지정
                        fileContents[currentFile] = ""; // 초기 빈 내용 설정
                        zip.file(fullPath, ""); 
                    }
                }

                // 수집된 파일 내용들을 ZIP에 최종 반영
                for (let filePath in fileContents) {
                    zip.file(filePath, fileContents[filePath]);
                }

                const content = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = "ttz_output.zip";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

            } catch (error) {
                alert("ZIP 생성 중 오류가 발생했습니다: " + error.message);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'ZIP 파일로 변환 및 다운로드';
            }
        });
    </script>

</body>
</html>
